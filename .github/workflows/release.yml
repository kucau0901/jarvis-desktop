# Every push to main and every PR builds the Mac and Windows apps; a tag v* also
# attaches them to that tag's GitHub release.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  # Made once, before the builds: two jobs each making it at the same moment gave two releases for one tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    # Pushes and PRs have no release job: build anyway.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (and publish on a tag)
        run: npm run dist -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificate: the Mac app is signed ad hoc (package.json build.mac.identity).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
